[project]
name = "ampere"
version = "0.1.0"
description = "Chatbot de suporte ao Cliente da Ampère Eletrônicos: agente orquestrado, RAG híbrido, memória, human-in-the-loop, guardrails, fila, streaming, observabilidade e evals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langchain-groq>=1.1",
    "typesafe-sdk>=0.7",
    "qdrant-client>=1.19",
    "fastembed>=0.8",
    "scikit-learn>=1.9",
    "numpy>=2",
    "psycopg[binary,pool]>=3.3",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "sse-starlette>=3.4",
    "typer>=0.27",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "python-frontmatter>=1.3",
    "langfuse>=4.15",
    "httpx>=0.28",
    "rich>=13",
]

[project.scripts]
ampere = "ampere.cli:app"
ampere-evals = "ampere.cli:evals"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ampere"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integracao: precisa de Postgres e/ou Qdrant reais"]
filterwarnings = ["ignore::DeprecationWarning"]
