# Sobe tudo: `docker compose up --build`. Só a infra: `docker compose up -d postgres qdrant`.
# As chaves (OPENAI_API_KEY, GROQ_API_KEY, TYPESAFE_API_KEY, LANGFUSE_*) vêm do .env ou do
# ambiente; sem nenhuma delas, deixe MODELOS_FALSOS=true para rodar sem gastar token.
# Feito para o desenvolvimento: a senha do Postgres é fixa e o Qdrant não tem chave, por isso
# as portas só abrem no 127.0.0.1 da sua máquina. Não suba este arquivo como está num servidor.

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://ampere:ampere@postgres:5432/ampere
    QDRANT_URL: http://qdrant:6333
    MODELOS_FALSOS: ${MODELOS_FALSOS:-false}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    LOGIN_EMAIL: ${LOGIN_EMAIL:-}
    LOGIN_SENHA_HASH: ${LOGIN_SENHA_HASH:-}
    SESSAO_HORAS: ${SESSAO_HORAS:-12}
    BFF_SEGREDO: ${BFF_SEGREDO:-}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ampere
      POSTGRES_PASSWORD: ampere
      POSTGRES_DB: ampere
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampere -d ampere"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A api e o worker usam a mesma imagem; só o comando muda (ADR 0004).
  api:
    <<: *backend
    command: ampere api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ampere worker

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNA: http://api:8000
      # O mesmo segredo da api, lido do .env da raiz; vazio nas duas pontas também funciona.
      BFF_SEGREDO: ${BFF_SEGREDO:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
